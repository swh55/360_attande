<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gear360 Hub — Stable Edition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f9e6e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css?v=2.0.0">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div><strong>Gear360 Hub</strong><small id="editionTag">Stable Edition</small></div>
    </div>
    <div class="state-pill" id="statePill"><span class="dot"></span><span id="stateText">—</span></div>
    <div class="spacer"></div>
    <button class="ghost-btn" id="langToggle" title="Language">EN</button>
  </header>

  <nav class="tabs" id="nav" aria-label="main navigation"></nav>

  <main class="view" id="view" tabindex="-1"></main>

  <footer class="foot">
    <span>CONTROL_ONLY · HTTP 8888 · FTP 21 · Telnet 23</span>
    <span class="foot-dim">Live Stream: DISABLED</span>
  </footer>
</div>

<div id="lightbox" class="lightbox" hidden><img alt="" id="lightboxImg"><button class="ghost-btn lb-close" id="lbClose">✕</button></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
